# Historical free-service template. Do not apply for public live mode.
# See deploy/render/PERSISTENT-STORAGE.md for the required mounted-store migration.
services:
  - type: web
    name: incidentpilot-judge
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: INCIDENTPILOT_PUBLIC_HOST
        value: "1"
      - key: NEBIUS_API_KEY
        sync: false
